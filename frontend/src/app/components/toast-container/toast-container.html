<div class="toast-region">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast"
      [class.toast-error]="toast.type === 'error'"
      [class.leaving]="toast.leaving"
      [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
      [attr.aria-live]="toast.type === 'error' ? 'assertive' : 'polite'">
      <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
        @if (toast.type === 'success') {
          <circle cx="10" cy="10" r="9" fill="currentColor" opacity=".16" />
          <path d="M5.8 10.4l2.6 2.6 5.8-5.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        } @else {
          <circle cx="10" cy="10" r="9" fill="currentColor" opacity=".16" />
          <path d="M10 5.5v5.5M10 14.2v.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        }
      </svg>
      <span class="text">{{ toast.text }}</span>
    </div>
  }
</div>
