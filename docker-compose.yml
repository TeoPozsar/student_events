services:
  postgres:
    image: postgres:17
    container_name: student-events-postgres
    environment:
      POSTGRES_DB: student_events
      POSTGRES_USER: student_user
      POSTGRES_PASSWORD: change_me_local_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: